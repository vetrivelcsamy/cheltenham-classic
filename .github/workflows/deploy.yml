name: Build, Package and Deploy Pages

# Builds the fonts from src/ on every push to main, then publishes the
# specimen site and download bundles.
#
# Previously this zipped whatever binaries happened to be committed in
# docs/font-files, so the site could serve something other than what the
# sources produce. It now rebuilds, which means the site, the downloads and
# a release all come from the same place.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need tags and history to derive the version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tools
        run: pip install -r requirements.txt

      - name: Install FontForge
        run: sudo apt-get update && sudo apt-get install -y fontforge

      # Without this the site served fonts stamped "Version 1.000" no matter
      # what they contained, so an OS or browser font cache had no reason to
      # refetch them. Derived from the latest tag plus the commits since, which
      # keeps it monotonic between releases: v1.1 + 3 commits -> 1.103.
      - name: Derive font version
        run: |
          tag=$(git describe --tags --abbrev=0 2>/dev/null || echo v1.0)
          base=${tag#v}
          major=${base%%.*}; minor=${base#*.}
          [ "$minor" = "$base" ] && minor=0
          n=$(git rev-list "$tag"..HEAD --count 2>/dev/null || echo 0)
          printf -v micro '%03d' $(( (10#$minor * 100 + n) % 1000 ))
          echo "FONT_VERSION=$major.$micro" >> "$GITHUB_ENV"
          echo "font version: $major.$micro (from $tag + $n commits)"

      - name: Build fonts from source
        run: ./scripts/build.sh

      - name: Are the combining marks drawn?
        id: marks
        continue-on-error: true
        run: python3 scripts/check_marks_drawn.py gf-submission

      # Only publish the fresh build when the marks have outlines. Otherwise
      # keep the committed fonts: a missing accent falls back to another face
      # and stays legible, where an empty one renders as the bare letter.
      - name: Refresh docs/font-files from the build
        if: steps.marks.outcome == 'success'
        run: |
          cp gf-submission/*.ttf docs/font-files/
          python3 scripts/webfonts.py docs/font-files docs/font-files

      - name: Keep the committed fonts
        if: steps.marks.outcome == 'failure'
        run: echo "::warning::Combining marks are not drawn yet; serving the committed fonts instead of this build."

      - name: Zip bundles and generate OTF
        run: |
          cd docs/font-files
          for f in *.ttf; do
            fontforge -c "import fontforge; f = fontforge.open('$f'); f.generate('${f%.ttf}.otf')"
          done
          zip -j CheltenhamClassic-TTF.zip   *.ttf
          zip -j CheltenhamClassic-OTF.zip   *.otf
          zip -j CheltenhamClassic-WOFF.zip  *.woff
          zip -j CheltenhamClassic-WOFF2.zip *.woff2

      - name: Create download links
        run: |
          cat > docs/downloads.md <<'MD'
          # Font Downloads

          - [Cheltenham Classic TTF](font-files/CheltenhamClassic-TTF.zip)
          - [Cheltenham Classic OTF](font-files/CheltenhamClassic-OTF.zip)
          - [Cheltenham Classic WOFF](font-files/CheltenhamClassic-WOFF.zip)
          - [Cheltenham Classic WOFF2](font-files/CheltenhamClassic-WOFF2.zip)
          MD

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"
      - id: deployment
        uses: actions/deploy-pages@v4
